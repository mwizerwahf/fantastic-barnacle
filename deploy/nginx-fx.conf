# 1) In the http { } context (e.g. /etc/nginx/conf.d/fx-ratelimit.conf):
#      limit_req_zone $binary_remote_addr zone=fx:10m rate=4r/s;
#
# 2) Paste the two location blocks INSIDE your HTTPS (listen 443 ssl) server block.
#    Never serve this over plain HTTP: the password and API tokens you type would travel in clear text.

location = /fx {
    return 301 /fx/;
}

location /fx/ {
    auth_basic           "FX console";
    auth_basic_user_file /etc/nginx/.htpasswd-fx;
    limit_req            zone=fx burst=40 nodelay;
    client_max_body_size 64k;

    # Trailing slash strips the /fx prefix: /fx/api/x -> /api/x
    proxy_pass         http://127.0.0.1:8060/;
    proxy_http_version 1.1;
    # $http_host keeps the port, so the console's same-origin check matches the browser's Origin.
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    add_header X-Robots-Tag            "noindex, nofollow" always;
    add_header X-Frame-Options         "DENY" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header Cache-Control           "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
