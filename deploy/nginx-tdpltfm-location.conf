# Paste these two blocks INSIDE the existing HTTPS (listen 443 ssl) server block
# for ecclesia.mwizerwa.com. Do not add them to a plain-HTTP (port 80) block:
# basic auth over HTTP would send your password in clear text.

location = /tdpltfm {
    return 301 /tdpltfm/;
}

location /tdpltfm/ {
    auth_basic           "Trading dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-tdpltfm;
    limit_req            zone=tdpltfm burst=40 nodelay;

    # Trailing slash strips the /tdpltfm prefix: /tdpltfm/api/x -> /api/x
    proxy_pass         http://127.0.0.1:8050/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    add_header X-Robots-Tag            "noindex, nofollow" always;
    add_header X-Frame-Options         "DENY" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header Cache-Control           "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
